name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - run: uv tool install 'ruff>=0.15,<1'
      - run: ruff check .
      - run: ruff format --check .
      - run: scripts/ascii-check.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
          python-version: ${{ matrix.python }}
      # The tests import only the standard library and halmem, so they do not need hal-kit or
      # hal-hub installed; PYTHONPATH makes the checkout importable.
      - run: uv venv && uv pip install pytest 'hatchling>=1.25,<2'
      - run: .venv/bin/python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 120 -O "${base}/${tarball}"
          curl -sSfL --max-time 120 -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - run: ./gitleaks git --log-opts=--all --no-banner
